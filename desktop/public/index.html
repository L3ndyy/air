<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air — Мессенджер</title>
</head>
<body>
  <script>window.AIR_APP_URL = window.AIR_APP_URL || 'http://localhost:3000';</script>
  <script src="config.js"></script>
  <script>
    (function () {
      // Direct navigation avoids iframe auth/storage issues in WebView.
      var target = window.AIR_APP_URL || "http://localhost:3000";
      var url = new URL(target);
      url.searchParams.set("desktop", "1");
      window.location.replace(url.toString());
    })();
  </script>
</body>
</html>
