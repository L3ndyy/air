[package]
name = "air-desktop"
version = "1.0.0"
description = "Air messenger desktop app (Windows)"
edition = "2021"
rust-version = "1.70"

[lib]
name = "air_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4"

[features]
default = []
